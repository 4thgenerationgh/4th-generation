<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4TH GENERATION</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #111;
        }

        header h1 {
            color: #00e5ff;
            font-size: 28px;
        }

        nav {
            padding: 18px;
            text-align: center;
            background: #181818;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #bbb;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .button {
            background: #00e5ff;
            color: black;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>4TH GENERATION</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h2>WELCOME TO 4TH GENERATION</h2>

        <p>A new generation. A new vision. A new beginning.</p>

        <a href="#about" class="button">DISCOVER MORE</a>
    </section>

    <footer>
        <p>© 2026 4TH GENERATION. All rights reserved.</p>
    </footer>

</body>
</html>
